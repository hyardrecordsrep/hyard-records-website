name: Sync releases from Spotify

on:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Until the Spotify keys are added as repository secrets, the daily run skips quietly
    env:
      HAS_KEYS: ${{ secrets.SPOTIFY_CLIENT_ID != '' && secrets.SPOTIFY_CLIENT_SECRET != '' }}
    steps:
      - name: Waiting for Spotify keys
        if: env.HAS_KEYS != 'true'
        run: echo "Add SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET as repository secrets to turn on the daily sync."

      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_KEYS == 'true'
        with:
          node-version: 22

      - name: Sync Hyard Records releases
        if: env.HAS_KEYS == 'true'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/sync-spotify.mjs

      - name: Rebuild release and artist pages
        if: env.HAS_KEYS == 'true'
        run: python3 scripts/build-pages.py

      - name: Commit changes
        if: env.HAS_KEYS == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "hyard-sync"
          git config user.email "hyard-sync@users.noreply.github.com"
          git add data/ assets/covers/spotify assets/artists release-*.html artist-*.html sitemap.xml
          git commit -m "Sync releases from Spotify"
          git push
